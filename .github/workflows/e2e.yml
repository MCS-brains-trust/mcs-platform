name: E2E Regression Suite

# Runs on a self-hosted runner on the application droplet, deliberately.
#
# The suite needs a restored copy of the production database, which contains real
# client financial data. GitHub-hosted runners would mean uploading that to
# infrastructure outside the firm's control on every run, so the data never leaves the
# droplet it already lives on.
#
# ============================================================================
# UNTESTED. No self-hosted runner is registered on this host, so nothing in this
# file has ever actually fired. It cannot be exercised safely until the conflict
# below is resolved, so treat every step here as reviewed-on-paper, not verified.
#
# actions/checkout@v4 checks the PR (or scheduled) ref out to $GITHUB_WORKSPACE,
# wherever the runner's work directory happens to be. The rig underneath this
# workflow does NOT follow that path: e2e/scripts/start_server.sh,
# config/settings_e2e.py and e2e/fixtures/instance.ts all hardcode
# /opt/statementhub -- the live production tree, where gunicorn, celery and
# celerybeat run from today. So as written, the Django instance under test would
# serve whatever is checked out at /opt/statementhub, not the PR's checkout, while
# the manifest and baselines being asserted against come from $GITHUB_WORKSPACE.
# That is silently wrong, not just broken: a runner registered with its work
# directory pointed AT /opt/statementhub to "fix" the mismatch would be worse --
# actions/checkout hard-resets its target on every run, which would blow away the
# live deployment. The guard step below refuses to proceed if that is ever the
# case, but the real fix (making the rig's paths follow $GITHUB_WORKSPACE, or
# deliberately running from a fixed worktree checkout of /opt/statementhub that
# checkout itself never touches) has not been designed or attempted here. Do not
# register a self-hosted runner against this workflow until that reconciliation is
# done.
# ============================================================================

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly, after which the data is refreshed from production so the suite keeps
    # running against representative rather than steadily staler data.
    - cron: "0 17 * * *"  # 03:00 AEST
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh the E2E database from production first"
        type: boolean
        default: false

concurrency:
  # The rig has one template database and one port per tier, so concurrent runs would
  # fight over both. Queue instead of racing.
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier1:
    name: Tier 1 route sweep
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Guard against workspace/deployment path collision
        # Deliberately the first step: everything after this assumes the checkout
        # is not, and cannot corrupt, /opt/statementhub. See the header comment --
        # this guard is the one thing standing between "misleading" and
        # "destructive" until the rig's hardcoded paths are reconciled with
        # $GITHUB_WORKSPACE.
        run: |
          set -euo pipefail
          DEPLOY_DIR="/opt/statementhub"
          WORKSPACE_REAL="$(realpath "${GITHUB_WORKSPACE}")"

          if [[ -d "${DEPLOY_DIR}" ]]; then
            DEPLOY_REAL="$(realpath "${DEPLOY_DIR}")"
            if [[ "${WORKSPACE_REAL}" == "${DEPLOY_REAL}" ]]; then
              echo "::error::GITHUB_WORKSPACE (${WORKSPACE_REAL}) IS the live deployment directory (${DEPLOY_DIR}). gunicorn, celery and celerybeat run from here in production. actions/checkout would hard-reset the production working tree on every run of this workflow. Refusing to continue -- see the header comment in .github/workflows/e2e.yml."
              exit 1
            fi

            if [[ -d "${DEPLOY_DIR}/.git" ]]; then
              DEPLOY_GIT_COMMON="$(git -C "${DEPLOY_DIR}" rev-parse --git-common-dir 2>/dev/null || true)"
              WORKSPACE_GIT_COMMON="$(git -C "${WORKSPACE_REAL}" rev-parse --git-common-dir 2>/dev/null || true)"
              if [[ -n "${DEPLOY_GIT_COMMON}" && -n "${WORKSPACE_GIT_COMMON}" ]]; then
                DEPLOY_GIT_COMMON_REAL="$(cd "${DEPLOY_DIR}" && realpath "${DEPLOY_GIT_COMMON}")"
                WORKSPACE_GIT_COMMON_REAL="$(cd "${WORKSPACE_REAL}" && realpath "${WORKSPACE_GIT_COMMON}")"
                if [[ "${DEPLOY_GIT_COMMON_REAL}" == "${WORKSPACE_GIT_COMMON_REAL}" ]]; then
                  echo "::error::${DEPLOY_DIR} is a git worktree sharing history with this checkout (common git dir ${DEPLOY_GIT_COMMON_REAL}). Running here risks mutating the production working tree through shared git state. Refusing to continue -- see the header comment in .github/workflows/e2e.yml."
                  exit 1
                fi
              fi
            fi
          fi

          echo "guard passed: ${WORKSPACE_REAL} is independent of ${DEPLOY_DIR}"

      - uses: actions/checkout@v4

      - name: Refresh E2E database
        # Nightly and on explicit request only. A refresh on every pull request would
        # add several minutes and, more importantly, would change the data underneath
        # the committed status baseline — making unrelated pull requests fail on
        # differences in production data rather than on their own changes.
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: bash scripts/refresh_e2e_db.sh

      - name: Install suite dependencies
        working-directory: e2e
        run: npm ci

      - name: Verify route manifest is current
        # A pull request that adds a route without regenerating the manifest would
        # otherwise pass while leaving the new route uncovered.
        run: |
          source /opt/statementhub/venv/bin/activate
          python3 manage.py e2e_dump_routes --settings=config.settings_e2e \
            --output=/tmp/routes.check.json
          if ! diff -q <(python3 -c "import json;d=json.load(open('/tmp/routes.check.json'));print(json.dumps([r['name'] for r in d['routes']],indent=0))") \
                       <(python3 -c "import json;d=json.load(open('e2e/tier1/routes.manifest.json'));print(json.dumps([r['name'] for r in d['routes']],indent=0))"); then
            echo "::error::Route manifest is stale. Regenerate with:"
            echo "::error::  python3 manage.py e2e_dump_routes --settings=config.settings_e2e"
            exit 1
          fi

      - name: Run Tier 1
        working-directory: e2e
        run: npx playwright test --project=tier1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tier1
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Upload Django log
        # DEBUG is False so the browser never sees a traceback; the log is where the
        # actual cause of a failing route lives.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: django-log
          path: .e2e/logs/django.log
          retention-days: 14

  tier2:
    name: Tier 2 accounting flows (scheduled only)
    runs-on: self-hosted
    timeout-minutes: 45
    # Deliberately not on pull_request: each Tier 2 spec file boots its own Django
    # instance and branches its own 500MB database (30-60s apiece), and the flows
    # it drives make one-way transitions (finalising a year, posting depreciation)
    # that a fast per-PR gate has no business affecting. Nightly/scheduled and
    # manual dispatch only. Same untested-workflow caveat as Tier 1 above applies.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Guard against workspace/deployment path collision
        # Identical to Tier 1's guard above -- see that job's copy and this file's
        # header comment for the full reasoning. Duplicated rather than factored
        # into a composite action because this workflow has never run and a shared
        # action would be one more untested thing to get right.
        run: |
          set -euo pipefail
          DEPLOY_DIR="/opt/statementhub"
          WORKSPACE_REAL="$(realpath "${GITHUB_WORKSPACE}")"

          if [[ -d "${DEPLOY_DIR}" ]]; then
            DEPLOY_REAL="$(realpath "${DEPLOY_DIR}")"
            if [[ "${WORKSPACE_REAL}" == "${DEPLOY_REAL}" ]]; then
              echo "::error::GITHUB_WORKSPACE (${WORKSPACE_REAL}) IS the live deployment directory (${DEPLOY_DIR}). gunicorn, celery and celerybeat run from here in production. actions/checkout would hard-reset the production working tree on every run of this workflow. Refusing to continue -- see the header comment in .github/workflows/e2e.yml."
              exit 1
            fi

            if [[ -d "${DEPLOY_DIR}/.git" ]]; then
              DEPLOY_GIT_COMMON="$(git -C "${DEPLOY_DIR}" rev-parse --git-common-dir 2>/dev/null || true)"
              WORKSPACE_GIT_COMMON="$(git -C "${WORKSPACE_REAL}" rev-parse --git-common-dir 2>/dev/null || true)"
              if [[ -n "${DEPLOY_GIT_COMMON}" && -n "${WORKSPACE_GIT_COMMON}" ]]; then
                DEPLOY_GIT_COMMON_REAL="$(cd "${DEPLOY_DIR}" && realpath "${DEPLOY_GIT_COMMON}")"
                WORKSPACE_GIT_COMMON_REAL="$(cd "${WORKSPACE_REAL}" && realpath "${WORKSPACE_GIT_COMMON}")"
                if [[ "${DEPLOY_GIT_COMMON_REAL}" == "${WORKSPACE_GIT_COMMON_REAL}" ]]; then
                  echo "::error::${DEPLOY_DIR} is a git worktree sharing history with this checkout (common git dir ${DEPLOY_GIT_COMMON_REAL}). Running here risks mutating the production working tree through shared git state. Refusing to continue -- see the header comment in .github/workflows/e2e.yml."
                  exit 1
                fi
              fi
            fi
          fi

          echo "guard passed: ${WORKSPACE_REAL} is independent of ${DEPLOY_DIR}"

      - uses: actions/checkout@v4

      - name: Refresh E2E database
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: bash scripts/refresh_e2e_db.sh

      - name: Install suite dependencies
        working-directory: e2e
        run: npm ci

      - name: Run Tier 2
        working-directory: e2e
        # Non-fatal here on purpose: a Tier 2 failure might be one of the two known
        # ones (expected, and handled by the next step) or a genuine new regression
        # (also handled by the next step) -- either way the check has to run
        # against the completed results.json rather than have the job stop here.
        run: npx playwright test --project=tier2 || true

      - name: Check Tier 2 failures match known_failures.json
        working-directory: e2e
        run: npm run check:tier2-failures

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tier2
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
