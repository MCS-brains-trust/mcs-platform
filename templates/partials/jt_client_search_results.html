{% if search_failed %}
  <div class="alert alert-warning py-2 px-3 small mb-0">
    StatementHub could not reach Job Tracker. Enter the XPM Client ID by hand,
    or leave it blank and link this entity later.
  </div>
{% elif clients %}
  <div class="list-group">
    {% for c in clients %}
    <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            onclick="document.getElementById('id_xpm_client_id').value='{{ c.xpmId }}';
                     document.getElementById('jtPicked').textContent='{{ c.displayName|escapejs }}';">
      <span>
        {{ c.displayName }}
        {% if c.abn %}<span class="text-muted small">&middot; ABN {{ c.abn }}</span>{% endif %}
      </span>
      <span class="badge bg-secondary">{{ c.entityType|default:"—" }}</span>
    </button>
    {% endfor %}
  </div>
{% elif query %}
  <p class="text-muted small mb-0">No matching Job Tracker clients.</p>
{% endif %}
